name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep every job on the version pinned in .nvmrc. See docs/adr/0003.
  NODE_VERSION: '22.23.2'

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Quality gates
        run: npm run qa

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: docs/quality/
          retention-days: 14

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Smoke suite
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 14

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      # Screenshots are platform-specific, so the Linux baselines are created by
      # this job on their first run and uploaded for committing. Once committed,
      # `missing` changes nothing and every later run is a real comparison.
      - name: Visual suite
        run: npx playwright test --project=visual --update-snapshots=missing

      - name: Upload baselines and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: |
            tests/visual/**/*.png
            playwright-report/
          retention-days: 14

  benchmark:
    name: Frame-time benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Flythrough
        run: npm run bench:flythrough

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: tests/bench/baselines/
          retention-days: 30
