name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Guarded by a repository variable so a fork, or a temporary switch to private,
# never turns CI red. Set DEPLOY_PAGES=true in repository variables to enable.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '22.23.2'

jobs:
  build:
    name: Build site
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      # The default first load is the procedural path, which needs no assets at
      # all. Imagery is fetched here so that the optional high-resolution toggle
      # has something to load lazily, and is never committed.
      - name: Fetch optional imagery
        run: npm run assets:fetch
        continue-on-error: true

      - name: Compress textures
        run: npm run build:textures
        continue-on-error: true

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    if: vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
